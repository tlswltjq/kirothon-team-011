spring.application.name=resume-review

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/resume-review
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health

# 요청 본문·토큰은 로그에 남기지 않는다.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# API 문서(요구사항 4.1~4.2). prod는 application-prod.properties에서 기본으로 끈다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
