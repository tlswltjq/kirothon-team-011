spring.application.name=resume-review

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/resume-review
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 운영 관측(요구사항 3.1, 3.4). 기본 프로필은 health만 노출한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 요청 본문·토큰은 로그에 남기지 않는다.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
# 콘솔 로그에 요청 ID(MDC requestId)를 보인다(요구사항 3.3).
logging.pattern.correlation=[%X{requestId:-}] 
