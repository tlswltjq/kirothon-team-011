spring.application.name=resume-review

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:18080}
server.error.include-message=never
server.error.include-stacktrace=never

# H2는 PostgreSQL 호환 모드로 같은 Flyway 마이그레이션(db/migration)을 쓴다.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/resume-review;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 운영 관측(요구사항 3.1, 3.4). 기본 프로필은 health만 노출한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 요청 본문·토큰은 로그에 남기지 않는다.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# 요구사항 2.3: IP별 1분 고정 창 요청 한도(POST /api/users, PDF 업로드)
app.rate-limit.users-per-minute=${RATE_LIMIT_USERS_PER_MIN:10}
app.rate-limit.uploads-per-minute=${RATE_LIMIT_UPLOADS_PER_MIN:20}

# 콘솔 로그에 요청 ID(MDC requestId)를 보인다(요구사항 3.3).
logging.pattern.correlation=[%X{requestId:-}] 

# API 문서(요구사항 4.1~4.2). prod는 application-prod.properties에서 기본으로 끈다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
