<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이력서 평가하기 - 이게 다 너 잘되라고 하는 소리야</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/review.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <div id="done-area"></div>
    <h1>이력서 평가하기</h1>
    <div id="status"></div>

    <section id="empty-area" class="hidden card">
      <h2>지금은 평가할 이력서가 없어요</h2>
      <p id="empty-count" class="hidden"></p>
      <p class="muted">새 이력서가 올라오면 다시 받을 수 있어요.</p>
      <div class="row">
        <a class="btn" href="/upload.html">내 이력서 올리기</a>
        <button type="button" id="retry-btn" class="secondary">다시 확인</button>
      </div>
    </section>

    <section id="review-area" class="hidden">
      <div class="card">
        <div class="row target-row">
          <div id="target-info"><strong id="target-role"></strong> <span id="target-version" class="muted"></span></div>
          <button type="button" id="other-btn" class="secondary">이 이력서 건너뛰기</button>
        </div>
        <p class="muted">고칠 곳을 누르면 핀이 꽂혀요. 핀 없이 총평만 남겨도 돼요.</p>
      </div>

      <div class="review-grid">
        <div class="review-image card">
          <div id="pages" class="pages"></div>
        </div>

        <div class="review-panel">
          <div class="card">
            <h2>내 핀 <span id="pin-count" class="muted"></span></h2>
            <div id="pin-list"></div>
            <p id="pin-empty" class="muted">아직 핀이 없습니다. 핀 없이 총평과 총점만 제출해도 됩니다.</p>
            <div id="pin-error"></div>
          </div>

          <form id="review-form" class="card" novalidate>
            <h2>총평과 총점</h2>
            <label for="summary">총평 (20자 이상)</label>
            <textarea id="summary" maxlength="1000" placeholder="가장 먼저 고칠 점과 좋은 점을 한두 문장으로 남겨 주세요."></textarea>
            <div id="summary-len" class="counter short">0 / 20자 이상</div>
            <div id="summary-error" class="field-error"></div>
            <label id="score-label">총점 (1~5)</label>
            <div class="score" id="score" role="radiogroup" aria-labelledby="score-label">
              <label><input type="radio" name="score" value="1"> 1</label>
              <label><input type="radio" name="score" value="2"> 2</label>
              <label><input type="radio" name="score" value="3"> 3</label>
              <label><input type="radio" name="score" value="4"> 4</label>
              <label><input type="radio" name="score" value="5"> 5</label>
            </div>
            <p class="muted score-hint">1 많이 고쳐야 해요 · 5 바로 지원해도 돼요</p>
            <div id="score-error" class="field-error"></div>
            <div id="form-error"></div>
            <div class="sticky-bar"><button type="submit" id="submit-btn" class="big-btn">평가 보내고 다음 이력서</button></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/js/review.js"></script>
</body>
</html>
