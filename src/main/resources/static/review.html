<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이력서 평가하기 - 이게 다 너 잘되라고 하는 소리야</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>이력서 평가하기</h1>
    <div id="status"></div>

    <section id="review-area" class="hidden">
      <div class="card">
        <div class="row">
          <div id="target-info"><strong id="target-role"></strong> <span id="target-version" class="muted"></span></div>
          <button type="button" id="other-btn" class="secondary">다른 이력서</button>
        </div>
        <p class="muted">이미지의 원하는 위치를 누르면 핀이 생기고 코멘트를 쓸 수 있습니다. 핀은 최대 50개이며, 제출하기 전까지는 이 브라우저에만 있습니다.</p>
      </div>

      <div class="card">
        <div id="pages" class="pages"></div>
      </div>

      <div class="card">
        <h2>내 핀 <span id="pin-count" class="muted"></span></h2>
        <div id="pin-list"></div>
        <p id="pin-empty" class="muted">아직 핀이 없습니다. 핀 없이 총평과 총점만 제출해도 됩니다.</p>
      </div>

      <form id="review-form" class="card">
        <h2>총평과 총점</h2>
        <label for="summary">총평 (20~1000자)</label>
        <textarea id="summary" maxlength="1000"></textarea>
        <div class="muted"><span id="summary-len">0</span> / 1000</div>
        <label>총점 (1~5)</label>
        <div class="score" id="score">
          <label><input type="radio" name="score" value="1"> 1</label>
          <label><input type="radio" name="score" value="2"> 2</label>
          <label><input type="radio" name="score" value="3"> 3</label>
          <label><input type="radio" name="score" value="4"> 4</label>
          <label><input type="radio" name="score" value="5"> 5</label>
        </div>
        <div id="form-error"></div>
        <p><button type="submit" id="submit-btn">평가 제출</button></p>
      </form>
    </section>

    <section id="done-area" class="hidden card">
      <h2>평가를 제출했습니다</h2>
      <p>도움이 되는 피드백 고맙습니다. 제출한 평가는 수정할 수 없습니다.</p>
      <button type="button" id="next-btn">다음 이력서 평가하기</button>
    </section>
  </main>
  <script type="module" src="/js/review.js"></script>
</body>
</html>
