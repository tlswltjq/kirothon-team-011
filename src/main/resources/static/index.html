<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>익명 이력서 평가</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>이름 없이 이력서 평가받기</h1>
    <section id="start" class="card hidden">
      <h2>닉네임으로 시작하기</h2>
      <p class="muted">이름·연락처·이메일은 받지 않습니다. 2~20자 닉네임만 정하면 바로 시작할 수 있습니다.</p>
      <form id="start-form">
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" minlength="2" maxlength="20" required autocomplete="off">
        <div id="nickname-error" class="field-error"></div>
        <p><button type="submit" id="start-btn">시작하기</button></p>
      </form>
      <div id="start-msg"></div>
    </section>
    <section id="menu" class="card hidden">
      <h2 id="welcome"></h2>
      <div class="row">
        <a class="btn" href="/upload.html">이력서 업로드</a>
        <a class="btn secondary" href="/review.html">평가하기</a>
        <a class="btn secondary" href="/my.html">내 이력서</a>
      </div>
    </section>
    <section id="notice" class="msg warn hidden">
      <strong>토큰 분실 안내</strong>
      <p>이 브라우저에 저장된 토큰이 계정의 전부입니다. 브라우저 저장소를 지우거나 다른 브라우저·기기를 쓰면 내 이력서와 받은 평가에 다시 접근할 수 없습니다. 같은 브라우저(시크릿 창이 아닌 일반 창)에서 계속 사용해 주세요.</p>
    </section>
  </main>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
