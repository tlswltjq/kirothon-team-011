# 운영 DB: PostgreSQL. 기본값이 없으므로 DB_URL·DB_USERNAME·DB_PASSWORD가 없으면 기동에 실패한다(1.2).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- C ops: management·logging·server (요구사항 3.2, 3.3) ---
management.server.port=${MANAGEMENT_PORT:18081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
server.forward-headers-strategy=native
server.address=${SERVER_ADDRESS:127.0.0.1}
