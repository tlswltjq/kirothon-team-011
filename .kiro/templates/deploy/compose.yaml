# 로컬 데모 배포. 공개 배포가 아니다. 앱 생성 후 루트로 복사하고 JAR 이름을 맞춘다.
name: kirothon
services:
  app:
    build:
      context: .
      args:
        JAR: build/libs/app.jar
    image: kirothon:local
    # host 네트워크로 앱의 127.0.0.1 바인딩을 그대로 쓴다(Linux 전용).
    network_mode: host
    environment:
      SERVER_ADDRESS: "127.0.0.1"
      SERVER_PORT: "18080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: "no"
volumes:
  data:
