# 로컬 데모 배포. 공개 배포가 아니다. 기본 프로필(H2) + demo.
# 이미지는 멀티 스테이지 Dockerfile이 컨테이너 안에서 빌드한다(호스트 bootJar 불필요).
name: kirothon
services:
  app:
    build:
      context: .
    image: kirothon:local
    # host 네트워크로 앱의 127.0.0.1 바인딩을 그대로 쓴다(Linux 전용).
    network_mode: host
    environment:
      SERVER_ADDRESS: "127.0.0.1"
      SERVER_PORT: "18080"
      DATA_DIR: /data
      SPRING_PROFILES_ACTIVE: demo
      # 기본 프로필은 관리 포트를 따로 두지 않는다.
      HEALTHCHECK_URL: http://127.0.0.1:18080/actuator/health
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: "no"
volumes:
  data:
